<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>인프런 콘텐츠 현황 · 영업 대시보드</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net"/>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet"/>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{
      --green:#00C471; --green-light:#E8FAF2; --green-dark:#00A35C;
      --orange:#FF7D33; --black:#1B1C1E; --gray-800:#3A3B3D; --gray-600:#6B6D72;
      --gray-400:#ADAEB3; --gray-200:#E0E0E2; --gray-100:#F4F4F5; --gray-50:#FAFAFA;
      --white:#FFFFFF; --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--gray-100);color:var(--black);min-height:100vh;-webkit-font-smoothing:antialiased}
    a{text-decoration:none;color:inherit}
    ::-webkit-scrollbar{height:6px;width:6px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:3px}
    .opt-row{cursor:pointer;transition:background .1s}
    .opt-row:hover{background:var(--gray-50)}
    .res-row:hover{background:var(--gray-50)}
    input,select,button{font-family:inherit}
    .spin{width:34px;height:34px;border:3px solid var(--gray-200);border-top-color:var(--green);border-radius:50%;animation:sp 0.8s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;

const CAT_COLORS = ["#00C471","#FF7D33","#3B82F6","#8B5CF6","#EF4444","#F59E0B","#10B981","#EC4899","#06B6D4","#6366F1","#84CC16","#F97316","#14B8A6"];

// ── helpers ───────────────────────────────────────────────
const nf = n => Number(n||0).toLocaleString();
const isFree = p => p === "" || p === 0 || p === null || p === undefined;
const numPrice = p => isFree(p) ? 0 : Number(p)||0;

const FACETS = [
  {key:"cat1",    label:"대표대분류", arr:false},
  {key:"cat1Mid", label:"대표중분류", arr:false},
  {key:"cat2",    label:"대분류",     arr:true},
  {key:"cat2Mid", label:"중분류",     arr:true},
  {key:"tags",    label:"기술태그",   arr:true},
  {key:"level",   label:"레벨",       arr:false},
];

const s = {
  section:{background:"var(--white)",borderRadius:"var(--radius-lg)",border:"1px solid var(--gray-200)",padding:"28px 32px",marginBottom:16},
  sectionTitle:{fontSize:15,fontWeight:700,color:"var(--black)",marginBottom:4,letterSpacing:"-0.2px"},
  sectionSub:{fontSize:13,color:"var(--gray-400)",marginBottom:20},
  tag:(active,color)=>({display:"inline-block",padding:"5px 12px",borderRadius:999,fontSize:12,fontWeight:500,cursor:"pointer",border:"none",transition:"all .12s",background:active?color:"var(--gray-100)",color:active?"#fff":"var(--gray-600)"}),
};

function LevelBadge({level}){
  const map={"입문":{bg:"#EFF6FF",color:"#3B82F6"},"초급":{bg:"#F0FDF4",color:"#16A34A"},"중급이상":{bg:"#FFF7ED",color:"#EA580C"}};
  const c=map[level]||{bg:"var(--gray-100)",color:"var(--gray-600)"};
  if(!level) return null;
  return <span style={{fontSize:11,fontWeight:500,padding:"2px 7px",borderRadius:4,background:c.bg,color:c.color,whiteSpace:"nowrap"}}>{level}</span>;
}
function PriceText({price}){
  if(isFree(price)) return <span style={{color:"var(--green)",fontWeight:600,fontSize:13}}>무료</span>;
  return <span style={{color:"var(--black)",fontWeight:600,fontSize:13}}>{nf(price)}원</span>;
}
function SubBadge({subscribable}){
  return subscribable
    ? <span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:"var(--green-light)",color:"var(--green-dark)",fontWeight:600}}>구독</span>
    : <span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:"var(--gray-100)",color:"var(--gray-400)"}}>구매</span>;
}
function StarRating({rating}){
  const r=Number(rating)||0;
  if(r<=0) return <span style={{fontSize:11,color:"var(--gray-400)"}}>평점 없음</span>;
  return <span style={{display:"inline-flex",alignItems:"center",gap:3}}>
    <span style={{color:"#F59E0B",fontSize:11,letterSpacing:1}}>{"★".repeat(Math.round(r))}{"☆".repeat(5-Math.round(r))}</span>
    <span style={{fontSize:11,color:"var(--gray-400)",fontWeight:500}}>{r.toFixed(1)}</span>
  </span>;
}

// ── KPI ───────────────────────────────────────────────────
function KPI({courses}){
  const total=courses.length;
  const sub=courses.filter(c=>c.subscribable).length;
  const cats=new Set(courses.map(c=>c.cat1)).size;
  const cards=[
    {label:"전체 강의",value:nf(total),unit:"개",desc:"총 보유 콘텐츠"},
    {label:"구독 가능",value:nf(sub),unit:"개",desc:`전체의 ${total?Math.round(sub/total*100):0}%`},
    {label:"대표대분류",value:cats,unit:"개",desc:"운영 중인 분야"},
  ];
  return <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:16}}>
    {cards.map((k,i)=>(
      <div key={i} style={{background:"var(--white)",borderRadius:"var(--radius-lg)",border:"1px solid var(--gray-200)",padding:"24px 28px"}}>
        <p style={{fontSize:12,color:"var(--gray-400)",marginBottom:12,fontWeight:500}}>{k.label}</p>
        <p style={{fontSize:32,fontWeight:800,letterSpacing:"-1px",lineHeight:1}}>{k.value}<span style={{fontSize:16,fontWeight:600,color:"var(--gray-400)",marginLeft:4}}>{k.unit}</span></p>
        <p style={{fontSize:11,color:"var(--gray-400)",marginTop:8}}>{k.desc}</p>
      </div>
    ))}
  </div>;
}

// ── 카테고리 분포 ─────────────────────────────────────────
function CatDistribution({courses}){
  const cats=useMemo(()=>{
    const m=new Map();
    courses.forEach(c=>m.set(c.cat1,(m.get(c.cat1)||0)+1));
    return [...m.entries()].map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
  },[courses]);
  const totalCat=cats.reduce((a,c)=>a+c.count,0);
  const maxCount=Math.max(...cats.map(c=>c.count),1);
  return <div style={s.section}>
    <p style={s.sectionTitle}>대표대분류별 강의 현황</p>
    <p style={{...s.sectionSub,marginBottom:24}}>전체 {nf(totalCat)}개 강의 분포</p>
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {cats.map((cat,i)=>{
        const pct=totalCat?((cat.count/totalCat)*100).toFixed(1):0;
        return <div key={i} style={{display:"grid",gridTemplateColumns:"140px 1fr 80px",alignItems:"center",gap:16}}>
          <span style={{fontSize:13,color:"var(--gray-800)",fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cat.name}</span>
          <div style={{height:6,borderRadius:3,background:"var(--gray-100)",overflow:"hidden"}}>
            <div style={{height:"100%",borderRadius:3,width:(cat.count/maxCount*100)+"%",background:CAT_COLORS[i%CAT_COLORS.length],transition:"width .6s ease"}}/>
          </div>
          <div style={{display:"flex",justifyContent:"flex-end",alignItems:"baseline",gap:4}}>
            <span style={{fontSize:14,fontWeight:700}}>{nf(cat.count)}</span>
            <span style={{fontSize:11,color:"var(--gray-400)"}}>{pct}%</span>
          </div>
        </div>;
      })}
    </div>
  </div>;
}

// ── 구독 커버리지 ─────────────────────────────────────────
function Coverage({courses}){
  const rows=useMemo(()=>{
    const m=new Map();
    courses.forEach(c=>{
      const r=m.get(c.cat1)||{total:0,sub:0};
      r.total++; if(c.subscribable) r.sub++;
      m.set(c.cat1,r);
    });
    return [...m.entries()].map(([name,r])=>({name,total:r.total,sub:r.sub,pct:r.total?r.sub/r.total*100:0}))
      .sort((a,b)=>b.pct-a.pct);
  },[courses]);
  return <div style={s.section}>
    <p style={s.sectionTitle}>구독 커버리지</p>
    <p style={s.sectionSub}>분야별 "전체 강의 중 구독으로 들을 수 있는 비율" · 구독권 영업 시 커버리지 근거</p>
    <div style={{display:"flex",flexDirection:"column",gap:14}}>
      {rows.map((r,i)=>(
        <div key={i} style={{display:"grid",gridTemplateColumns:"140px 1fr 150px",alignItems:"center",gap:16}}>
          <span style={{fontSize:13,color:"var(--gray-800)",fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</span>
          <div style={{height:18,borderRadius:5,background:"var(--gray-100)",overflow:"hidden",position:"relative"}}>
            <div style={{height:"100%",width:r.pct+"%",background:r.pct>=50?"var(--green)":r.pct>=25?"var(--orange)":"var(--gray-400)",transition:"width .6s ease"}}/>
            <span style={{position:"absolute",left:8,top:0,height:"100%",display:"flex",alignItems:"center",fontSize:11,fontWeight:700,color:r.pct>15?"#fff":"var(--gray-600)"}}>{r.pct.toFixed(0)}%</span>
          </div>
          <span style={{fontSize:12,color:"var(--gray-600)",textAlign:"right"}}>구독 {nf(r.sub)} / 전체 {nf(r.total)}</span>
        </div>
      ))}
    </div>
  </div>;
}

// ── 무료 vs 유료 ──────────────────────────────────────────
function FreePaid({courses}){
  const {free,paid}=useMemo(()=>{
    let free=0; courses.forEach(c=>{if(isFree(c.price))free++;});
    return {free,paid:courses.length-free};
  },[courses]);
  const total=free+paid;
  const freePct=total?free/total*100:0;
  const byCat=useMemo(()=>{
    const m=new Map();
    courses.forEach(c=>{
      const r=m.get(c.cat1)||{free:0,total:0};
      r.total++; if(isFree(c.price))r.free++; m.set(c.cat1,r);
    });
    return [...m.entries()].map(([name,r])=>({name,free:r.free,total:r.total,pct:r.total?r.free/r.total*100:0}))
      .sort((a,b)=>b.total-a.total);
  },[courses]);
  const ring={width:140,height:140,borderRadius:"50%",background:`conic-gradient(var(--green) 0 ${freePct}%, var(--gray-800) ${freePct}% 100%)`,display:"flex",alignItems:"center",justifyContent:"center"};
  return <div style={s.section}>
    <p style={s.sectionTitle}>무료 vs 유료</p>
    <p style={s.sectionSub}>가격 정보 기준 · 무료 콘텐츠 비중</p>
    <div style={{display:"flex",gap:32,alignItems:"center",flexWrap:"wrap"}}>
      <div style={{display:"flex",alignItems:"center",gap:20}}>
        <div style={ring}><div style={{width:96,height:96,borderRadius:"50%",background:"var(--white)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
          <span style={{fontSize:22,fontWeight:800,color:"var(--green)"}}>{freePct.toFixed(0)}%</span>
          <span style={{fontSize:10,color:"var(--gray-400)"}}>무료</span>
        </div></div>
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{width:10,height:10,borderRadius:2,background:"var(--green)"}}/><span style={{fontSize:13,color:"var(--gray-800)"}}>무료 <b>{nf(free)}</b>개</span></div>
          <div style={{display:"flex",alignItems:"center",gap:8}}><span style={{width:10,height:10,borderRadius:2,background:"var(--gray-800)"}}/><span style={{fontSize:13,color:"var(--gray-800)"}}>유료 <b>{nf(paid)}</b>개</span></div>
        </div>
      </div>
      <div style={{flex:1,minWidth:300,display:"flex",flexDirection:"column",gap:9}}>
        {byCat.map((r,i)=>(
          <div key={i} style={{display:"grid",gridTemplateColumns:"120px 1fr 70px",alignItems:"center",gap:12}}>
            <span style={{fontSize:12,color:"var(--gray-600)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.name}</span>
            <div style={{height:8,borderRadius:4,background:"var(--gray-100)",overflow:"hidden",display:"flex"}}>
              <div style={{height:"100%",width:r.pct+"%",background:"var(--green)"}}/>
            </div>
            <span style={{fontSize:11,color:"var(--gray-400)",textAlign:"right"}}>무료 {r.pct.toFixed(0)}%</span>
          </div>
        ))}
      </div>
    </div>
  </div>;
}

// ── 인기 Top5 ─────────────────────────────────────────────
function Popular({courses}){
  const cats=useMemo(()=>{
    const m=new Map();
    courses.forEach(c=>m.set(c.cat1,(m.get(c.cat1)||0)+1));
    return [...m.entries()].sort((a,b)=>b[1]-a[1]).map(([name])=>name);
  },[courses]);
  const [tab,setTab]=useState(cats[0]);
  const top5=useMemo(()=>courses.filter(c=>c.cat1===tab).sort((a,b)=>b.students-a.students).slice(0,5),[courses,tab]);
  return <div style={s.section}>
    <p style={s.sectionTitle}>대표대분류별 인기 강좌 Top 5</p>
    <p style={s.sectionSub}>수강생 수 기준</p>
    <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:20}}>
      {cats.map((c,i)=>(<button key={c} onClick={()=>setTab(c)} style={s.tag(tab===c,CAT_COLORS[i%CAT_COLORS.length])}>{c}</button>))}
    </div>
    <div style={{display:"flex",flexDirection:"column"}}>
      {top5.map((c,idx)=>(
        <a key={c.id} href={c.link} target="_blank" rel="noopener noreferrer"
          style={{display:"flex",alignItems:"center",gap:16,padding:"14px 0",borderBottom:idx<top5.length-1?"1px solid var(--gray-100)":"none"}}>
          <span style={{width:28,height:28,borderRadius:"var(--radius-sm)",background:idx===0?"var(--green)":"var(--gray-100)",color:idx===0?"#fff":"var(--gray-400)",fontSize:12,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{idx+1}</span>
          <div style={{flex:1,minWidth:0}}>
            <p style={{fontSize:14,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:4}}>{c.title}</p>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <LevelBadge level={c.level}/><StarRating rating={c.rating}/>
              <span style={{fontSize:12,color:"var(--gray-400)"}}>수강생 {nf(c.students)}명</span>
            </div>
          </div>
          <PriceText price={c.price}/>
        </a>
      ))}
    </div>
  </div>;
}

// ── Facet 멀티선택 ────────────────────────────────────────
function Facet({label,options,selected,onToggle}){
  const [q,setQ]=useState("");
  const list=useMemo(()=>{
    const ql=q.trim().toLowerCase();
    return options.filter(o=>!ql||o.value.toLowerCase().includes(ql)).slice(0,200);
  },[options,q]);
  return <div style={{border:"1px solid var(--gray-200)",borderRadius:"var(--radius-md)",padding:12,background:"var(--white)"}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
      <span style={{fontSize:12,fontWeight:700,color:"var(--gray-800)"}}>{label}</span>
      <span style={{fontSize:11,color:selected.size?"var(--green-dark)":"var(--gray-400)",fontWeight:600}}>{selected.size?`${selected.size} 선택`:`${options.length}개`}</span>
    </div>
    <input value={q} onChange={e=>setQ(e.target.value)} placeholder="검색"
      style={{width:"100%",border:"1px solid var(--gray-200)",borderRadius:6,padding:"6px 9px",fontSize:12,marginBottom:8,outline:"none"}}/>
    <div style={{maxHeight:170,overflowY:"auto",display:"flex",flexDirection:"column"}}>
      {list.map(o=>{
        const on=selected.has(o.value);
        return <div key={o.value} className="opt-row" onClick={()=>onToggle(o.value)}
          style={{display:"flex",alignItems:"center",gap:7,padding:"5px 6px",borderRadius:5}}>
          <span style={{width:15,height:15,borderRadius:4,border:on?"none":"1.5px solid var(--gray-200)",background:on?"var(--green)":"#fff",color:"#fff",fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{on?"✓":""}</span>
          <span style={{fontSize:12,color:"var(--gray-800)",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.value}</span>
          <span style={{fontSize:10,color:"var(--gray-400)"}}>{nf(o.count)}</span>
        </div>;
      })}
      {list.length===0&&<p style={{fontSize:11,color:"var(--gray-400)",padding:"8px 6px"}}>결과 없음</p>}
    </div>
  </div>;
}

// ── 스택 기반 필터 ────────────────────────────────────────
function StackFilter({courses}){
  const empty=()=>({cat1:new Set(),cat1Mid:new Set(),cat2:new Set(),cat2Mid:new Set(),tags:new Set(),level:new Set()});
  const [sel,setSel]=useState(empty);
  const [subOnly,setSubOnly]=useState(false);
  const [priceMode,setPriceMode]=useState("all");
  const [q,setQ]=useState("");
  const [sortKey,setSortKey]=useState("students");
  const [visible,setVisible]=useState(60);
  const [copied,setCopied]=useState(false);

  const facetOptions=useMemo(()=>{
    const out={};
    FACETS.forEach(f=>{
      const m=new Map();
      courses.forEach(c=>{
        const v=c[f.key];
        if(f.arr){(v||[]).forEach(x=>{if(x)m.set(x,(m.get(x)||0)+1);});}
        else if(v){m.set(v,(m.get(v)||0)+1);}
      });
      out[f.key]=[...m.entries()].map(([value,count])=>({value,count})).sort((a,b)=>b.count-a.count);
    });
    return out;
  },[courses]);

  const toggle=(key,value)=>setSel(prev=>{
    const next={...prev}; const set=new Set(prev[key]);
    set.has(value)?set.delete(value):set.add(value); next[key]=set; return next;
  });

  const filtered=useMemo(()=>{
    const ql=q.trim().toLowerCase();
    return courses.filter(c=>{
      for(const f of FACETS){
        const set=sel[f.key]; if(set.size===0) continue;
        if(f.arr){ if(!(c[f.key]||[]).some(x=>set.has(x))) return false; }
        else if(!set.has(c[f.key])) return false;
      }
      if(subOnly && !c.subscribable) return false;
      if(priceMode==="free" && !isFree(c.price)) return false;
      if(priceMode==="paid" && isFree(c.price)) return false;
      if(ql && !((c.title||"")+" "+(c.instructor||"")).toLowerCase().includes(ql)) return false;
      return true;
    });
  },[courses,sel,subOnly,priceMode,q]);

  const sorted=useMemo(()=>{
    const a=[...filtered];
    if(sortKey==="students") a.sort((x,y)=>y.students-x.students);
    else if(sortKey==="priceAsc") a.sort((x,y)=>numPrice(x.price)-numPrice(y.price));
    else if(sortKey==="priceDesc") a.sort((x,y)=>numPrice(y.price)-numPrice(x.price));
    else if(sortKey==="rating") a.sort((x,y)=>y.rating-x.rating);
    return a;
  },[filtered,sortKey]);

  useEffect(()=>{setVisible(60);},[sel,subOnly,priceMode,q,sortKey]);
  useEffect(()=>{setCopied(false);},[sel,subOnly,priceMode,q]);

  const activeCount=FACETS.reduce((a,f)=>a+sel[f.key].size,0)+(subOnly?1:0)+(priceMode!=="all"?1:0)+(q.trim()?1:0);
  const subCnt=filtered.filter(c=>c.subscribable).length;
  const freeCnt=filtered.filter(c=>isFree(c.price)).length;

  const copyTSV=()=>{
    const head=["강의명","강사","레벨","수강생","가격","구독","링크"].join("\t");
    const lines=sorted.map(c=>[c.title,c.instructor,c.level,c.students,isFree(c.price)?"무료":c.price,c.subscribable?"구독":"구매",c.link].join("\t"));
    const tsv=[head,...lines].join("\n");
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(tsv).then(()=>setCopied(true)).catch(()=>fallback(tsv));
    } else fallback(tsv);
  };
  const fallback=(text)=>{
    const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
    ta.select(); try{document.execCommand("copy"); setCopied(true);}catch(e){} document.body.removeChild(ta);
  };

  const th={fontSize:11,fontWeight:600,color:"var(--gray-400)",padding:"10px 14px",textAlign:"left",borderBottom:"1px solid var(--gray-200)",whiteSpace:"nowrap",letterSpacing:"0.3px"};
  const td={fontSize:13,color:"var(--gray-800)",padding:"11px 14px",borderBottom:"1px solid var(--gray-100)",verticalAlign:"middle"};

  return <div style={s.section}>
    <p style={s.sectionTitle}>스택 기반 강좌 필터</p>
    <p style={s.sectionSub}>고객사 개발 스택·직무에 맞춰 6개 차원으로 강좌를 추려 제안 목록을 만드세요 (같은 차원 안=OR, 차원 간=AND)</p>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(230px,1fr))",gap:12,marginBottom:16}}>
      {FACETS.map(f=>(<Facet key={f.key} label={f.label} options={facetOptions[f.key]} selected={sel[f.key]} onToggle={v=>toggle(f.key,v)}/>))}
    </div>

    <div style={{display:"flex",flexWrap:"wrap",gap:8,alignItems:"center",marginBottom:18}}>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="강의명·강사 검색"
        style={{flex:"1 1 200px",minWidth:160,border:"1px solid var(--gray-200)",borderRadius:8,padding:"9px 12px",fontSize:13,outline:"none"}}/>
      <button onClick={()=>setSubOnly(v=>!v)} style={s.tag(subOnly,"var(--green)")}>구독 가능만</button>
      <button onClick={()=>setPriceMode(m=>m==="free"?"all":"free")} style={s.tag(priceMode==="free","var(--green)")}>무료만</button>
      <button onClick={()=>setPriceMode(m=>m==="paid"?"all":"paid")} style={s.tag(priceMode==="paid","var(--gray-800)")}>유료만</button>
      <select value={sortKey} onChange={e=>setSortKey(e.target.value)}
        style={{border:"1px solid var(--gray-200)",borderRadius:8,padding:"9px 12px",fontSize:13,color:"var(--gray-800)",outline:"none",cursor:"pointer"}}>
        <option value="students">수강생 많은순</option>
        <option value="rating">평점 높은순</option>
        <option value="priceDesc">가격 높은순</option>
        <option value="priceAsc">가격 낮은순</option>
      </select>
      {activeCount>0 && <button onClick={()=>{setSel(empty());setSubOnly(false);setPriceMode("all");setQ("");}}
        style={{border:"1px solid var(--gray-200)",background:"#fff",borderRadius:8,padding:"9px 12px",fontSize:12,color:"var(--gray-600)",cursor:"pointer"}}>초기화 ({activeCount})</button>}
    </div>

    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10,marginBottom:12}}>
      <p style={{fontSize:13,color:"var(--gray-600)"}}>
        조건에 맞는 강좌 <b style={{color:"var(--black)",fontSize:15}}>{nf(filtered.length)}</b>개
        <span style={{color:"var(--gray-400)"}}> · 구독 가능 {nf(subCnt)} · 무료 {nf(freeCnt)}</span>
      </p>
      <button onClick={copyTSV} disabled={!filtered.length}
        style={{border:"none",background:copied?"var(--green-dark)":"var(--green)",color:"#fff",borderRadius:8,padding:"9px 16px",fontSize:13,fontWeight:600,cursor:filtered.length?"pointer":"not-allowed",opacity:filtered.length?1:0.5}}>
        {copied?"✓ 복사됨":"목록 복사 (엑셀 붙여넣기)"}
      </button>
    </div>

    <div style={{overflowX:"auto",borderRadius:"var(--radius-md)",border:"1px solid var(--gray-200)"}}>
      <table style={{width:"100%",borderCollapse:"collapse",minWidth:680}}>
        <thead style={{background:"var(--gray-50)"}}>
          <tr>
            <th style={{...th,width:32,textAlign:"center"}}>#</th>
            <th style={th}>강의명 / 기술태그</th>
            <th style={th}>강사</th>
            <th style={{...th,textAlign:"right"}}>수강생</th>
            <th style={{...th,textAlign:"right"}}>가격</th>
            <th style={{...th,textAlign:"center"}}>구독</th>
          </tr>
        </thead>
        <tbody>
          {sorted.slice(0,visible).map((c,i)=>(
            <tr key={c.id} className="res-row">
              <td style={{...td,textAlign:"center",color:"var(--gray-400)",fontWeight:600,fontSize:12}}>{i+1}</td>
              <td style={td}>
                <a href={c.link} target="_blank" rel="noopener noreferrer" title={c.title}
                  style={{fontWeight:500,fontSize:13,display:"block",maxWidth:420,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:4}}>{c.title}</a>
                <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                  <LevelBadge level={c.level}/>
                  {(c.tags||[]).slice(0,4).map((t,k)=>(<span key={k} style={{fontSize:10,padding:"1px 6px",borderRadius:4,background:"var(--gray-100)",color:"var(--gray-600)"}}>{t}</span>))}
                  {(c.tags||[]).length>4 && <span style={{fontSize:10,color:"var(--gray-400)"}}>+{c.tags.length-4}</span>}
                </div>
              </td>
              <td style={{...td,color:"var(--gray-600)",whiteSpace:"nowrap",fontSize:12}}>{c.instructor}</td>
              <td style={{...td,textAlign:"right",whiteSpace:"nowrap",fontSize:12,color:"var(--gray-600)"}}>{nf(c.students)}</td>
              <td style={{...td,textAlign:"right",whiteSpace:"nowrap"}}><PriceText price={c.price}/></td>
              <td style={{...td,textAlign:"center"}}><SubBadge subscribable={c.subscribable}/></td>
            </tr>
          ))}
          {sorted.length===0 && <tr><td colSpan={6} style={{textAlign:"center",padding:"48px 0",fontSize:13,color:"var(--gray-400)"}}>조건에 맞는 강좌가 없습니다</td></tr>}
        </tbody>
      </table>
    </div>
    {visible<sorted.length && <div style={{textAlign:"center",marginTop:16}}>
      <button onClick={()=>setVisible(v=>v+60)} style={{border:"1px solid var(--gray-200)",background:"#fff",borderRadius:8,padding:"10px 24px",fontSize:13,fontWeight:600,color:"var(--gray-800)",cursor:"pointer"}}>
        더 보기 ({nf(sorted.length-visible)}개 남음)
      </button>
    </div>}
  </div>;
}

// ── App ───────────────────────────────────────────────────
function App(){
  const [state,setState]=useState({loading:true,error:null,data:null});
  useEffect(()=>{
    fetch("./data.json",{cache:"no-store"})
      .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(d=>setState({loading:false,error:null,data:d}))
      .catch(e=>setState({loading:false,error:e.message,data:null}));
  },[]);

  if(state.loading) return <Center><div className="spin"/><p style={{marginTop:16,fontSize:13,color:"var(--gray-400)"}}>데이터 불러오는 중…</p></Center>;
  if(state.error) return <Center>
    <p style={{fontSize:14,fontWeight:600,marginBottom:6}}>데이터를 불러오지 못했어요</p>
    <p style={{fontSize:12,color:"var(--gray-400)",maxWidth:380,textAlign:"center",lineHeight:1.6}}>같은 폴더에 <b>data.json</b>이 배포돼 있는지 확인하세요. (updater에서 데이터 배포 필요)<br/>오류: {state.error}</p>
  </Center>;

  const {courses=[],exportedAt}=state.data;
  const updatedAt=exportedAt?new Date(exportedAt).toLocaleString("ko-KR",{year:"numeric",month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"}):"";

  return <div style={{minHeight:"100vh"}}>
    <header style={{background:"var(--white)",borderBottom:"1px solid var(--gray-200)"}}>
      <div style={{maxWidth:1080,margin:"0 auto",padding:"0 24px",height:56,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <svg width="90" height="22" viewBox="0 0 90 22"><text x="0" y="17" fontFamily="Pretendard,sans-serif" fontWeight="800" fontSize="18" fill="#00C471">inflearn</text></svg>
          <span style={{fontSize:12,color:"var(--gray-400)",paddingLeft:10,borderLeft:"1px solid var(--gray-200)"}}>영업 대시보드</span>
        </div>
        <span style={{fontSize:11,color:"var(--gray-400)"}}>{updatedAt} 기준</span>
      </div>
    </header>
    <main style={{maxWidth:1080,margin:"0 auto",padding:"28px 24px 60px"}}>
      <KPI courses={courses}/>
      <CatDistribution courses={courses}/>
      <Coverage courses={courses}/>
      <FreePaid courses={courses}/>
      <Popular courses={courses}/>
      <StackFilter courses={courses}/>
      <p style={{textAlign:"center",fontSize:11,color:"var(--gray-400)"}}>인프런 실데이터 기반 영업용 내부 문서</p>
    </main>
  </div>;
}
function Center({children}){
  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>{children}</div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
