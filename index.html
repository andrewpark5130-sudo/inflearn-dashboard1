  function StarRating({rating}) {
    return (
      <span style={{display:"flex",alignItems:"center",gap:2}}>
        {[1,2,3,4,5].map(i=>(
          <span key={i} style={{fontSize:10,color:i<=Math.round(rating)?"#F59E0B":"#E2E8F0"}}>★</span>
        ))}
        <span style={{fontSize:10,color:"#94A3B8",marginLeft:2}}>{Number(rating).toFixed(1)}</span>
      </span>
    );
  }

  function KanbanBoard({categories, popular}) {
    const [cols, setCols] = useState(() =>
      categories.map((cat, i) => ({
        ...cat,
        color: COLORS[i % COLORS.length],
        cards: (popular[cat.name] || []).map((c, j) => ({ ...c, id: `${cat.name}-${j}` }))
      }))
    );
    const dragCard = useRef(null);
    const dragCol = useRef(null);

    const onDragStart = (colIdx, cardIdx) => {
      dragCard.current = cardIdx;
      dragCol.current = colIdx;
    };

    const onDrop = (targetColIdx) => {
      if (dragCol.current === null || dragCard.current === null) return;
      if (dragCol.current === targetColIdx) return;
      setCols(prev => {
        const next = prev.map(c => ({ ...c, cards: [...c.cards] }));
        const [moved] = next[dragCol.current].cards.splice(dragCard.current, 1);
        next[targetColIdx].cards.push(moved);
        return next;
      });
      dragCard.current = null;
      dragCol.current = null;
    };

    const [dragOverCol, setDragOverCol] = useState(null);

    return (
      <div className="kanban-wrap">
        {cols.map((col, ci) => (
          <div
            key={col.id}
            className={`col${dragOverCol === ci ? " drag-over" : ""}`}
            onDragOver={e => { e.preventDefault(); setDragOverCol(ci); }}
            onDragLeave={() => setDragOverCol(null)}
            onDrop={() => { onDrop(ci); setDragOverCol(null); }}
          >
            <div className="col-header">
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{width:10,height:10,borderRadius:"50%",background:col.color,flexShrink:0}}/>
                <span style={{fontSize:13,fontWeight:700,color:"#1E293B"}}>{col.name}</span>
              </div>
              <span style={{fontSize:11,fontWeight:600,padding:"2px 8px",borderRadius:999,background:col.color+"15",color:col.color}}>
                {col.cards.length}개
              </span>
            </div>
            <div className="col-body">
              {col.cards.map((card, ki) => (
                <div
                  key={card.id}
                  className="card"
                  draggable
                  onDragStart={() => onDragStart(ci, ki)}
                >
                  <a href={card.link} target="_blank" rel="noopener noreferrer">
                    <p style={{fontSize:12,fontWeight:600,color:"#1E293B",lineHeight:1.4,marginBottom:8}}>{card.title}</p>
                  </a>
                  <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>
                    <span className={`badge level`}>{String(card.level).replace(/[\[\]]/g,"")}</span>
                    {(card.price === "무료" || card.price === "" || card.price === 0) &&
                      <span className="badge free">무료</span>}
                  </div>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                    <StarRating rating={Number(card.rating)||0}/>
                    <span style={{fontSize:11,color:"#94A3B8"}}>
                      👥 {Number(card.students||0).toLocaleString()}명
                    </span>
                  </div>
                  {card.price !== "무료" && card.price !== "" && card.price !== 0 &&
                    <div style={{marginTop:8,paddingTop:8,borderTop:"1px solid #F1F5F9"}}>
                      <span style={{fontSize:12,fontWeight:700,color:col.color}}>
                        {Number(card.price).toLocaleString()}원
                      </span>
                    </div>
                  }
                </div>
              ))}
              {col.cards.length === 0 &&
                <div style={{textAlign:"center",padding:"32px 0",fontSize:12,color:"#CBD5E1"}}>
                  강좌를 드래그해서 옮겨보세요
                </div>
              }
            </div>
          </div>
        ))}
      </div>
    );
  }

  function App() {
    const { totalContent: total, subscribable: sub, categories: cats, popular } = INIT;
    const totalCat = cats.reduce((s, c) => s + c.count, 0);
    const maxCount = Math.max(...cats.map(c => c.count), 1);
    const box = (ex={}) => ({background:"#fff",borderRadius:16,border:"1px solid #E2E8F0",boxShadow:"0 1px 3px rgba(0,0,0,0.04)",padding:24,...ex});

    return (
      <div style={{minHeight:"100vh",background:"#F1F5F9"}}>
        {/* Header */}
        <div style={{background:"#fff",borderBottom:"1px solid #E2E8F0",padding:"24px 32px",marginBottom:24}}>
          <div style={{maxWidth:1400,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}>
                <div style={{width:4,height:24,borderRadius:4,background:"#2563EB"}}/>
                <h1 style={{fontSize:22,fontWeight:700,color:"#0F172A"}}>인프런 콘텐츠 현황</h1>
              </div>
              <p style={{fontSize:13,color:"#94A3B8",marginLeft:12}}>영업용 콘텐츠 현황 요약 · 2025</p>
            </div>
            <span style={{fontSize:12,background:"#F0FDF4",color:"#16A34A",padding:"6px 14px",borderRadius:999,border:"1px solid #BBF7D0",fontWeight:600}}>
              ✅ 실데이터 기반
            </span>
          </div>
        </div>

        <div style={{maxWidth:1400,margin:"0 auto",padding:"0 24px"}}>
          {/* KPI */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16,marginBottom:24}}>
            {[
              {label:"전체 강의 수",value:total,icon:"📦",desc:"총 보유 콘텐츠",color:"#2563EB"},
              {label:"구독 제공 가능 수",value:sub,icon:"🔓",desc:"구독 전환 가능",color:"#7C3AED"},
              {label:"카테고리 수",value:cats.length,icon:"🗂️",desc:"운영 중 카테고리",color:"#059669"},
            ].map((k,i) => (
              <div key={i} style={box()}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                  <span style={{fontSize:24}}>{k.icon}</span>
                  <span style={{fontSize:11,fontWeight:500,padding:"4px 8px",borderRadius:999,background:k.color+"12",color:k.color}}>{k.desc}</span>
                </div>
                <div style={{fontSize:40,fontWeight:700,color:k.color}}>{k.value.toLocaleString()}</div>
                <p style={{fontSize:13,fontWeight:500,color:"#64748B",marginTop:8}}>{k.label}</p>
              </div>
            ))}
          </div>

          {/* Category Bar Chart */}
          <div style={box({marginBottom:24})}>
            <h2 style={{fontSize:15,fontWeight:700,color:"#0F172A",marginBottom:20}}>📊 카테고리별 강의 현황</h2>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              {cats.map((cat,i) => {
                const pct = totalCat > 0 ? Math.round((cat.count/totalCat)*100) : 0;
                const barPct = (cat.count/maxCount)*100;
                const color = COLORS[i%COLORS.length];
                return (
                  <div key={cat.id}>
                    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{width:10,height:10,borderRadius:"50%",background:color,flexShrink:0}}/>
                        <span style={{fontSize:13,fontWeight:500,color:"#334155"}}>{cat.name}</span>
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span style={{fontSize:11,color:"#94A3B8"}}>{pct}%</span>
                        <span style={{fontSize:20,fontWeight:700,color:color}}>{cat.count.toLocaleString()}</span>
                        <span style={{fontSize:11,color:"#94A3B8"}}>개</span>
                      </div>
                    </div>
                    <div style={{height:8,borderRadius:4,background:"#F1F5F9",overflow:"hidden"}}>
                      <div style={{height:"100%",borderRadius:4,width:`${barPct}%`,background:color}}/>
                    </div>
                  </div>
                );
              })}
            </div>
            <div style={{marginTop:16,paddingTop:16,borderTop:"1px solid #F1F5F9",display:"flex",justifyContent:"space-between",fontSize:12,color:"#94A3B8"}}>
              <span>전체 카테고리 강의 합계</span>
              <span style={{fontWeight:600,color:"#334155"}}>{totalCat.toLocaleString()}개</span>
            </div>
          </div>

          {/* Kanban Board */}
          <div style={{...box({padding:"24px 0"}),marginBottom:32,overflow:"hidden"}}>
            <h2 style={{fontSize:15,fontWeight:700,color:"#0F172A",marginBottom:4,padding:"0 24px"}}>🗂️ 카테고리별 인기 강좌</h2>
            <p style={{fontSize:12,color:"#94A3B8",marginBottom:16,padding:"0 24px"}}>카드를 드래그해서 다른 카테고리로 이동할 수 있어요</p>
            <KanbanBoard categories={cats} popular={popular}/>
          </div>

          <p style={{textAlign:"center",fontSize:11,color:"#CBD5E1",paddingBottom:32}}>인프런 실데이터 기반 영업용 대시보드</p>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
