  function StarRating({rating}){
    const r = Number(rating)||0;
    return <span style={{display:"flex",alignItems:"center",gap:3}}>
      <span style={{color:"#F59E0B",fontSize:11,letterSpacing:1}}>
        {"★".repeat(Math.round(r))}{"☆".repeat(5-Math.round(r))}
      </span>
      <span style={{fontSize:11,color:"var(--gray-400)",fontWeight:500}}>{r.toFixed(1)}</span>
    </span>;
  }

  function PriceText({price}){
    if(!price||price===""||price===0) return <span style={{color:"var(--green)",fontWeight:600,fontSize:13}}>무료</span>;
    return <span style={{color:"var(--black)",fontWeight:600,fontSize:13}}>{Number(price).toLocaleString()}원</span>;
  }

  function SubBadge({subscribable}){
    if(subscribable) return <span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:"var(--green-light)",color:"var(--green-dark)",fontWeight:600}}>구독</span>;
    return <span style={{fontSize:11,padding:"2px 8px",borderRadius:4,background:"var(--gray-100)",color:"var(--gray-400)"}}>구매</span>;
  }

  function CourseTable({courses}){
    const [rows,setRows]=useState(courses.map((c,i)=>({...c,_key:i})));
    const dragIdx=useRef(null);
    const [dragOver,setDragOver]=useState(null);
    const onDragStart=i=>{dragIdx.current=i;};
    const onDrop=i=>{
      if(dragIdx.current===null||dragIdx.current===i)return;
      setRows(prev=>{const next=[...prev];const[moved]=next.splice(dragIdx.current,1);next.splice(i,0,moved);return next;});
      dragIdx.current=null;setDragOver(null);
    };
    const th={fontSize:11,fontWeight:600,color:"var(--gray-400)",padding:"10px 14px",textAlign:"left",borderBottom:"1px solid var(--gray-200)",whiteSpace:"nowrap",letterSpacing:"0.3px",textTransform:"uppercase"};
    const td={fontSize:13,color:"var(--gray-800)",padding:"12px 14px",borderBottom:"1px solid var(--gray-100)",verticalAlign:"middle"};
    return <div style={{overflowX:"auto",borderRadius:"var(--radius-md)",border:"1px solid var(--gray-200)"}}>
      <table style={{width:"100%",borderCollapse:"collapse",minWidth:620}}>
        <thead style={{background:"var(--gray-50)"}}>
          <tr>
            <th style={{...th,width:32}}></th>
            <th style={{...th,width:32,textAlign:"center"}}>#</th>
            <th style={th}>강의명</th>
            <th style={th}>강사</th>
            <th style={{...th,textAlign:"right"}}>수강생</th>
            <th style={{...th,textAlign:"right"}}>가격</th>
            <th style={{...th,textAlign:"center"}}>구독</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((c,i)=>(
            <tr key={c._key} className={"drag-row"+(dragOver===i?" drag-over":"")}
              draggable onDragStart={()=>onDragStart(i)}
              onDragOver={e=>{e.preventDefault();setDragOver(i);}}
              onDragLeave={()=>setDragOver(null)}
              onDrop={()=>onDrop(i)}>
              <td style={{...td,color:"var(--gray-200)",cursor:"grab",fontSize:16,paddingRight:0}}>⠿</td>
              <td style={{...td,textAlign:"center",color:"var(--gray-400)",fontWeight:600,fontSize:12}}>{i+1}</td>
              <td style={td}>
                <a href={c.link} target="_blank" rel="noopener noreferrer"
                  style={{fontWeight:500,fontSize:13,display:"block",maxWidth:340,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",color:"var(--black)"}}
                  title={c.title}
                  onMouseEnter={e=>e.currentTarget.style.color="var(--green)"}
                  onMouseLeave={e=>e.currentTarget.style.color="var(--black)"}
                >{c.title}</a>
                <span style={s.levelBadge(c.level)}>{String(c.level||"").replace(/[[]]/g,"")}</span>
              </td>
              <td style={{...td,color:"var(--gray-600)",whiteSpace:"nowrap",fontSize:12}}>{c.instructor}</td>
              <td style={{...td,textAlign:"right",whiteSpace:"nowrap",fontSize:12,color:"var(--gray-600)"}}>{Number(c.students||0).toLocaleString()}</td>
              <td style={{...td,textAlign:"right",whiteSpace:"nowrap"}}><PriceText price={c.price}/></td>
              <td style={{...td,textAlign:"center"}}><SubBadge subscribable={c.subscribable}/></td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>;
  }

              const barPct=(cat.count/maxCount)*100;
              const color=CAT_COLORS[i%CAT_COLORS.length];
              return <div key={i} style={{display:"grid",gridTemplateColumns:"140px 1fr 80px",alignItems:"center",gap:16}}>
                <span style={{fontSize:13,color:"var(--gray-800)",fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{cat.name}</span>
                <div style={{height:6,borderRadius:3,background:"var(--gray-100)",overflow:"hidden"}}>
                  <div style={{height:"100%",borderRadius:3,width:barPct+"%",background:color,transition:"width 0.6s ease"}}/>
                </div>
                <div style={{display:"flex",justifyContent:"flex-end",alignItems:"baseline",gap:4}}>
                  <span style={{fontSize:14,fontWeight:700,color:"var(--black)"}}>{cat.count.toLocaleString()}</span>
                  <span style={{fontSize:11,color:"var(--gray-400)"}}>{pct}%</span>
                </div>
              </div>;
            })}
          </div>
        </div>

        {/* 인기 강좌 Top5 */}
        <div style={s.section}>
          <p style={s.sectionTitle}>카테고리별 인기 강좌 Top 5</p>
          <p style={s.sectionSub}>수강생 수 기준</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:20}}>
            {cats.map((cat,i)=>(
              <button key={i} onClick={()=>setPopTab(cat.name)}
                style={s.tag(popTab===cat.name, CAT_COLORS[i%CAT_COLORS.length])}>
                {cat.name}
              </button>
            ))}
          </div>
          <div style={{display:"flex",flexDirection:"column"}}>
            {popCourses.map((c,idx)=>(
              <a key={idx} href={c.link} target="_blank" rel="noopener noreferrer"
                style={{display:"flex",alignItems:"center",gap:16,padding:"14px 0",borderBottom:idx<popCourses.length-1?"1px solid var(--gray-100)":"none"}}
                onMouseEnter={e=>{e.currentTarget.querySelector(".course-title").style.color="var(--green)"}}
                onMouseLeave={e=>{e.currentTarget.querySelector(".course-title").style.color="var(--black)"}}>
                <span style={{width:28,height:28,borderRadius:"var(--radius-sm)",background:idx===0?"var(--green)":"var(--gray-100)",color:idx===0?"#fff":"var(--gray-400)",fontSize:12,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{idx+1}</span>
                <div style={{flex:1,minWidth:0}}>
                  <p className="course-title" style={{fontSize:14,fontWeight:600,color:"var(--black)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",transition:"color 0.1s",marginBottom:4}}>{c.title}</p>
                  <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
                    <span style={s.levelBadge(c.level)}>{String(c.level||"").replace(/[[]]/g,"")}</span>
                    <StarRating rating={Number(c.rating)||0}/>
                    <span style={{fontSize:12,color:"var(--gray-400)"}}>수강생 {Number(c.students||0).toLocaleString()}명</span>
                  </div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <PriceText price={c.price}/>
                </div>
              </a>
            ))}
          </div>
        </div>

        {/* 전체 강좌 테이블 */}
        <div style={s.section}>
          <p style={s.sectionTitle}>카테고리별 전체 강좌</p>
          <p style={s.sectionSub}>수강생 Top 20 · 행 드래그로 순서 변경 가능</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:6,marginBottom:20}}>
            {cats.map((cat,i)=>(
              <button key={i} onClick={()=>setCatTab(cat.name)}
                style={s.tag(catTab===cat.name, CAT_COLORS[i%CAT_COLORS.length])}>
                {cat.name}
              </button>
            ))}
          </div>
          {allCourses.length>0
            ?<CourseTable key={catTab} courses={allCourses}/>
            :<p style={{textAlign:"center",padding:"48px 0",fontSize:13,color:"var(--gray-400)"}}>데이터가 없습니다</p>}
        </div>

        <p style={{textAlign:"center",fontSize:11,color:"var(--gray-400)"}}>인프런 실데이터 기반 영업용 내부 문서</p>
      </main>
    </div>;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
