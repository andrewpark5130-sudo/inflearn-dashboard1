- 수강 형태: ${mode==="subscribe"?`구독제 (구독 가능 강의 ${sub}개 내에서)`:`구매형 (전체 강의 ${total}개 활용)`}
- 카테고리별 강의 수: ${catList}
- 예산: ${budget?budget+"원":"제한 없음"} / 현재 실력: ${cur} / 목표 실력: ${tgt} / 수강 기간: ${dur||"미정"}
- 학습 목표: ${goal}
[JSON 형식]
{"title":"제목","summary":"요약","totalWeeks":숫자,"stages":[{"stage":번호,"title":"단계명","level":"난이도","weeks":주수,"category":"카테고리","courses":["강좌1","강좌2"],"goal":"목표"}],"tip":"팁"}`;
        try{
          const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1500,messages:[{role:"user",content:prompt}]})});
          const d=await r.json();
          const t=d.content?.find(b=>b.type==="text")?.text||"";
          setRes(JSON.parse(t.replace(/```json|```/g,"").trim()));
        }catch(e){setRes({error:"로드맵 생성에 실패했습니다."});}
        setLoading(false);
      };

      return <div style={box({marginTop:24})}>
        <h2 style={{fontSize:15,fontWeight:700,color:"#374151",marginBottom:4}}>🗺️ 맞춤 학습 로드맵 생성</h2>
        <p style={{fontSize:12,color:"#9CA3AF",marginBottom:20}}>조건을 입력하면 AI가 인프런 콘텐츠 기반으로 최적의 커리큘럼을 구성해드려요</p>
        <div style={{display:"flex",gap:8,marginBottom:16}}>
          {[["subscribe","🔓 구독제"],["purchase","🛒 구매형"]].map(([v,l])=>(
            <button key={v} onClick={()=>setMode(v)} style={{flex:1,padding:"10px 0",borderRadius:12,fontSize:13,fontWeight:600,border:"none",cursor:"pointer",background:mode===v?"#2563EB":"#F3F4F6",color:mode===v?"#fff":"#6B7280"}}>{l}</button>
          ))}
        </div>
        <div style={{fontSize:12,color:"#2563EB",background:"#EFF6FF",borderRadius:8,padding:"8px 12px",marginBottom:16}}>
          {mode==="subscribe"
            ? `✅ 월정액으로 구독 강의 ${sub.toLocaleString()}개 무제한 수강 가능 — 예산 제한 없음`
            : `✅ 전체 강의 ${total.toLocaleString()}개 활용`}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
          {mode==="purchase" && <div>
            <label style={{fontSize:12,fontWeight:500,color:"#6B7280",display:"block",marginBottom:4}}>💰 예산 (원, 선택)</label>
            <input style={{width:"100%",border:"1px solid #E5E7EB",borderRadius:8,padding:"8px 12px",fontSize:13,outline:"none"}} placeholder="예: 300000" value={budget} onChange={e=>setBudget(e.target.value)} type="number"/>
          </div>}
          <div style={{gridColumn:mode==="subscribe"?"span 2":"auto"}}>
            <label style={{fontSize:12,fontWeight:500,color:"#6B7280",display:"block",marginBottom:4}}>⏱️ 수강 기간 (선택)</label>
            <input style={{width:"100%",border:"1px solid #E5E7EB",borderRadius:8,padding:"8px 12px",fontSize:13,outline:"none"}} placeholder="예: 3개월" value={dur} onChange={e=>setDur(e.target.value)}/>
          </div>
          <div>
            <label style={{fontSize:12,fontWeight:500,color:"#6B7280",display:"block",marginBottom:4}}>📊 현재 실력</label>
            <div style={{display:"flex",gap:4}}>{levels.map(l=><button key={l} onClick={()=>setCur(l)} style={{flex:1,padding:"6px 0",borderRadius:8,fontSize:11,fontWeight:500,border:"none",cursor:"pointer",background:cur===l?"#2563EB":"#F3F4F6",color:cur===l?"#fff":"#6B7280"}}>{l}</button>)}</div>
          </div>
          <div>
            <label style={{fontSize:12,fontWeight:500,color:"#6B7280",display:"block",marginBottom:4}}>🎯 목표 실력</label>
            <div style={{display:"flex",gap:4}}>{levels.map(l=><button key={l} onClick={()=>setTgt(l)} style={{flex:1,padding:"6px 0",borderRadius:8,fontSize:11,fontWeight:500,border:"none",cursor:"pointer",background:tgt===l?"#7C3AED":"#F3F4F6",color:tgt===l?"#fff":"#6B7280"}}>{l}</button>)}</div>
          </div>
        </div>
        <div style={{marginBottom:16}}>
          <label style={{fontSize:12,fontWeight:500,color:"#6B7280",display:"block",marginBottom:4}}>✏️ 학습 목표 <span style={{color:"#EF4444"}}>*</span></label>
          <textarea style={{width:"100%",border:"1px solid #E5E7EB",borderRadius:8,padding:"8px 12px",fontSize:13,outline:"none",resize:"none"}} rows={2} placeholder="예: 백엔드 개발자로 취업하고 싶어요" value={goal} onChange={e=>setGoal(e.target.value)}/>
        </div>
        <button onClick={generate} disabled={loading} style={{width:"100%",padding:"12px 0",borderRadius:12,fontSize:13,fontWeight:700,color:"#fff",border:"none",cursor:loading?"not-allowed":"pointer",background:loading?"#93C5FD":"#2563EB"}}>
          {loading?"🤖 AI가 로드맵을 구성하는 중...":"🚀 로드맵 생성하기"}
        </button>
        {res&&!res.error&&<div style={{marginTop:24}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:4}}>
            <h3 style={{fontSize:15,fontWeight:700,color:"#1F2937"}}>{res.title}</h3>
            <span style={{fontSize:11,background:"#EFF6FF",color:"#2563EB",padding:"4px 8px",borderRadius:999,whiteSpace:"nowrap",marginLeft:8}}>총 {res.totalWeeks}주</span>
          </div>
          <p style={{fontSize:13,color:"#6B7280",marginBottom:16}}>{res.summary}</p>
          <div style={{display:"flex",flexDirection:"column",gap:12}}>
            {res.stages?.map((st,i)=>(
              <div key={i} style={{borderRadius:12,padding:16,border:`1px solid ${sc[i%sc.length]}40`,background:sc[i%sc.length]+"08"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                  <span style={{width:24,height:24,borderRadius:"50%",background:sc[i%sc.length],color:"#fff",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{st.stage}</span>
                  <span style={{fontWeight:600,fontSize:13,color:"#1F2937"}}>{st.title}</span>
                  <span style={{marginLeft:"auto",fontSize:11,color:"#9CA3AF"}}>{st.level} · {st.weeks}주</span>
                </div>
                <p style={{fontSize:11,color:"#6B7280",marginBottom:8}}>{st.goal}</p>
                <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                  {st.courses?.map((c,j)=><span key={j} style={{fontSize:11,padding:"2px 8px",borderRadius:999,background:"#fff",border:`1px solid ${sc[i%sc.length]}60`,color:sc[i%sc.length]}}>{c}</span>)}
                </div>
              </div>
            ))}
          </div>
          {res.tip&&<div style={{marginTop:16,padding:12,background:"#FFFBEB",border:"1px solid #FEF3C7",borderRadius:12,fontSize:11,color:"#92400E"}}>💡 {res.tip}</div>}
        </div>}
        {res?.error&&<p style={{marginTop:16,fontSize:13,color:"#EF4444",textAlign:"center"}}>{res.error}</p>}
      </div>;
    }

    function App(){
      const {totalContent:total,subscribable:sub,categories:cats,popular} = DATA;
      const [tab,setTab]=useState(cats[0].name);
      const totalCat=cats.reduce((s,c)=>s+c.count,0);
      const maxCount=Math.max(...cats.map(c=>c.count),1);
      const courses=popular[tab]||[];

      return <div style={{minHeight:"100vh",background:"#F9FAFB",padding:"40px 20px"}}>
        <div style={{maxWidth:800,margin:"0 auto"}}>

          {/* Header */}
          <div style={{marginBottom:32}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
              <div style={{width:4,height:24,borderRadius:4,background:"#2563EB"}}/>
              <h1 style={{fontSize:22,fontWeight:700,color:"#1F2937"}}>인프런 콘텐츠 현황</h1>
            </div>
            <p style={{fontSize:13,color:"#9CA3AF",marginLeft:12}}>영업용 콘텐츠 현황 요약 · 2025</p>
          </div>

          {/* KPI */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16,marginBottom:24}}>
            {[
              {label:"전체 강의 수",value:total,icon:"📦",desc:"총 보유 콘텐츠"},
              {label:"구독 제공 가능 수",value:sub,icon:"🔓",desc:"구독 전환 가능"},
              {label:"카테고리 수",value:cats.length,icon:"🗂️",desc:"운영 중 카테고리"},
            ].map((k,i)=>(
              <div key={i} style={box()}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                  <span style={{fontSize:22}}>{k.icon}</span>
                  <span style={{fontSize:11,fontWeight:500,padding:"4px 8px",borderRadius:999,background:"#EFF6FF",color:"#2563EB"}}>{k.desc}</span>
                </div>
                <div style={{fontSize:40,fontWeight:700,color:"#2563EB"}}>{k.value.toLocaleString()}</div>
                <p style={{fontSize:13,fontWeight:500,color:"#6B7280",marginTop:8}}>{k.label}</p>
              </div>
            ))}
          </div>

          {/* Category Chart */}
          <div style={box({marginBottom:24})}>
            <h2 style={{fontSize:15,fontWeight:700,color:"#374151",marginBottom:24}}>📊 카테고리별 강의 현황</h2>
            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              {cats.map((cat,i)=>{
                const pct=totalCat>0?Math.round((cat.count/totalCat)*100):0;
                const barPct=(cat.count/maxCount)*100;
                const color=COLORS[i%COLORS.length];
                return <div key={cat.id}>
                  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{width:10,height:10,borderRadius:"50%",background:color,flexShrink:0}}/>
                      <span style={{fontSize:13,fontWeight:500,color:"#374151"}}>{cat.name}</span>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <span style={{fontSize:11,color:"#9CA3AF"}}>{pct}%</span>
                      <span style={{fontSize:22,fontWeight:700,color:"#2563EB"}}>{cat.count.toLocaleString()}</span>
                      <span style={{fontSize:11,color:"#9CA3AF"}}>개</span>
                    </div>
                  </div>
                  <div style={{height:8,borderRadius:4,background:"#F3F4F6",overflow:"hidden"}}>
                    <div style={{height:"100%",borderRadius:4,width:`${barPct}%`,background:color}}/>
                  </div>
                </div>;
              })}
            </div>
            <div style={{marginTop:16,paddingTop:16,borderTop:"1px solid #F3F4F6",display:"flex",justifyContent:"space-between",fontSize:12,color:"#9CA3AF"}}>
              <span>전체 카테고리 강의 합계</span>
              <span style={{fontWeight:600,color:"#374151"}}>{totalCat.toLocaleString()}개</span>
            </div>
          </div>

          {/* Popular */}
          <div style={box({marginBottom:24})}>
            <h2 style={{fontSize:15,fontWeight:700,color:"#374151",marginBottom:4}}>⭐ 카테고리별 인기 강좌 Top 5</h2>
            <p style={{fontSize:12,color:"#9CA3AF",marginBottom:16}}>수강생 수 기준 상위 5개 강좌</p>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:20}}>
              {cats.map((cat,i)=>(
                <button key={cat.id} onClick={()=>setTab(cat.name)}
                  style={{padding:"6px 12px",borderRadius:999,fontSize:12,fontWeight:500,border:"none",cursor:"pointer",background:tab===cat.name?COLORS[i%COLORS.length]:"#F3F4F6",color:tab===cat.name?"#fff":"#6B7280"}}>
                  {cat.name}
                </button>
              ))}
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {courses.map((c,idx)=>(
                <a key={idx} href={c.link} target="_blank" rel="noopener noreferrer"
                  style={{display:"flex",alignItems:"center",gap:12,padding:12,borderRadius:12,background:"#F9FAFB",textDecoration:"none"}}
                  onMouseEnter={e=>e.currentTarget.style.background="#EFF6FF"}
                  onMouseLeave={e=>e.currentTarget.style.background="#F9FAFB"}>
                  <span style={{width:24,height:24,borderRadius:"50%",background:"#DBEAFE",color:"#2563EB",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{idx+1}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <p style={{fontSize:13,fontWeight:500,color:"#1F2937",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.title}</p>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginTop:2,flexWrap:"wrap"}}>
                      <span style={{fontSize:11,padding:"2px 6px",borderRadius:4,background:"#E5E7EB",color:"#6B7280"}}>{c.level}</span>
                      <StarRating rating={Number(c.rating)||0}/>
                      <span style={{fontSize:11,color:"#9CA3AF"}}>수강생 {Number(c.students).toLocaleString()}명</span>
                    </div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <p style={{fontSize:13,fontWeight:700,color:"#2563EB"}}>{c.price==="무료"||c.price===""?"무료":Number(c.price).toLocaleString()+"원"}</p>
                    <p style={{fontSize:11,color:"#9CA3AF"}}>바로가기 →</p>
                  </div>
                </a>
              ))}
            </div>
          </div>

          <Roadmap cats={cats} total={total} sub={sub}/>
          <p style={{textAlign:"center",fontSize:11,color:"#D1D5DB",marginTop:24}}>인프런 실데이터 기반 영업용 대시보드</p>
        </div>
      </div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
