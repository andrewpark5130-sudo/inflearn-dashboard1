  }

  function CourseTable({catName, courses}) {
    const [rows, setRows] = useState(courses.map((c,i)=>({...c,_key:i})));
    const dragIdx = useRef(null);
    const [dragOver, setDragOver] = useState(null);

    const onDragStart = i => { dragIdx.current = i; };
    const onDrop = i => {
      if (dragIdx.current === null || dragIdx.current === i) return;
      setRows(prev => {
        const next = [...prev];
        const [moved] = next.splice(dragIdx.current, 1);
        next.splice(i, 0, moved);
        return next;
      });
      dragIdx.current = null; setDragOver(null);
    };

    const thStyle = {fontSize:11,fontWeight:600,color:"#64748B",padding:"10px 12px",textAlign:"left",borderBottom:"1px solid #E2E8F0",whiteSpace:"nowrap"};

    return (
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",minWidth:600}}>
          <thead style={{background:"#F8FAFC"}}>
            <tr>
              <th style={{...thStyle,width:32}}></th>
              <th style={{...thStyle,width:36}}>#</th>
              <th style={thStyle}>강의명</th>
              <th style={thStyle}>강사명</th>
              <th style={{...thStyle,textAlign:"right"}}>수강생</th>
              <th style={{...thStyle,textAlign:"right"}}>가격</th>
              <th style={{...thStyle,textAlign:"center"}}>구독</th>
            </tr>
          </thead>
          <tbody>
            {rows.map((c, i) => (
              <tr key={c._key}
                className={`drag-row${dragOver===i?" drag-over":""}`}
                draggable
                onDragStart={()=>onDragStart(i)}
                onDragOver={e=>{e.preventDefault();setDragOver(i);}}
                onDragLeave={()=>setDragOver(null)}
                onDrop={()=>onDrop(i)}>
                <td style={{...tdStyle,color:"#CBD5E1",fontSize:14,cursor:"grab"}}>⠿</td>
                <td style={{...tdStyle,color:"#94A3B8",fontWeight:600}}>{i+1}</td>
                <td style={tdStyle}>
                  <a href={c.link} target="_blank" rel="noopener noreferrer"
                    style={{color:"#2563EB",fontWeight:500,fontSize:12,display:"block",maxWidth:320,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}
                    title={c.title}>{c.title}</a>
                  <span style={{fontSize:10,color:"#94A3B8"}}>{String(c.level||"").replace(/[\[\]]/g,"")}</span>
                </td>
                <td style={{...tdStyle,whiteSpace:"nowrap"}}>{c.instructor}</td>
                <td style={{...tdStyle,textAlign:"right",whiteSpace:"nowrap"}}>{Number(c.students||0).toLocaleString()}명</td>
                <td style={{...tdStyle,textAlign:"right",whiteSpace:"nowrap",fontWeight:600,color:"#2563EB"}}>
                  {!c.price||c.price===""||c.price===0?"무료":Number(c.price).toLocaleString()+"원"}
                </td>
                <td style={{...tdStyle,textAlign:"center"}}>
                  {c.subscribable
                    ? <span style={{fontSize:10,padding:"2px 6px",borderRadius:999,background:"#F0FDF4",color:"#16A34A",border:"1px solid #BBF7D0"}}>✓ 구독</span>
                    : <span style={{fontSize:10,padding:"2px 6px",borderRadius:999,background:"#F8FAFC",color:"#94A3B8"}}>구매</span>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    );
  }

  function App() {
    const { totalContent:total, subscribable:sub, categories:cats, popular, allByCat } = DATA;
    const [popTab, setPopTab] = useState(cats[0].name);
    const [catTab, setCatTab] = useState(cats[0].name);
    const totalCat = cats.reduce((s,c)=>s+c.count,0);
    const maxCount = Math.max(...cats.map(c=>c.count),1);
    const popCourses = popular[popTab]||[];
    const allCourses = allByCat[catTab]||[];
    const box = (ex={})=>({background:"#fff",borderRadius:16,border:"1px solid #E2E8F0",boxShadow:"0 1px 3px rgba(0,0,0,0.04)",padding:24,...ex});

    return <div style={{minHeight:"100vh",background:"#F1F5F9"}}>
      {/* Header */}
      <div style={{background:"#fff",borderBottom:"1px solid #E2E8F0",padding:"24px 32px",marginBottom:24}}>
        <div style={{maxWidth:1100,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:2}}>
              <div style={{width:4,height:24,borderRadius:4,background:"#2563EB"}}/>
              <h1 style={{fontSize:22,fontWeight:700,color:"#0F172A"}}>인프런 콘텐츠 현황</h1>
            </div>
            <p style={{fontSize:13,color:"#94A3B8",marginLeft:12}}>영업용 콘텐츠 현황 요약 · 2025</p>
          </div>
          <span style={{fontSize:12,background:"#F0FDF4",color:"#16A34A",padding:"6px 14px",borderRadius:999,border:"1px solid #BBF7D0",fontWeight:600}}>✅ 실데이터 기반</span>
        </div>
      </div>

      <div style={{maxWidth:1100,margin:"0 auto",padding:"0 24px"}}>
        {/* KPI */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16,marginBottom:24}}>
          {[
            {label:"전체 강의 수",value:total,icon:"📦",desc:"총 보유 콘텐츠",color:"#2563EB"},
            {label:"구독 제공 가능 수",value:sub,icon:"🔓",desc:"구독 전환 가능",color:"#7C3AED"},
            {label:"카테고리 수",value:cats.length,icon:"🗂️",desc:"운영 중 카테고리",color:"#059669"},
          ].map((k,i)=>(
            <div key={i} style={box()}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                <span style={{fontSize:22}}>{k.icon}</span>
                <span style={{fontSize:11,fontWeight:500,padding:"4px 8px",borderRadius:999,background:k.color+"12",color:k.color}}>{k.desc}</span>
              </div>
              <div style={{fontSize:40,fontWeight:700,color:k.color}}>{k.value.toLocaleString()}</div>
              <p style={{fontSize:13,fontWeight:500,color:"#64748B",marginTop:8}}>{k.label}</p>
            </div>
          ))}
        </div>

        {/* Category Chart */}
        <div style={box({marginBottom:24})}>
          <h2 style={{fontSize:15,fontWeight:700,color:"#0F172A",marginBottom:20}}>📊 카테고리별 강의 현황</h2>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {cats.map((cat,i)=>{
              const pct=totalCat>0?Math.round((cat.count/totalCat)*100):0;
              const barPct=(cat.count/maxCount)*100;
              const color=COLORS[i%COLORS.length];
              return <div key={cat.id}>
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}}>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{width:10,height:10,borderRadius:"50%",background:color,flexShrink:0}}/>
                    <span style={{fontSize:13,fontWeight:500,color:"#334155"}}>{cat.name}</span>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:11,color:"#94A3B8"}}>{pct}%</span>
                    <span style={{fontSize:20,fontWeight:700,color}}>{cat.count.toLocaleString()}</span>
                    <span style={{fontSize:11,color:"#94A3B8"}}>개</span>
                  </div>
                </div>
                <div style={{height:8,borderRadius:4,background:"#F1F5F9",overflow:"hidden"}}>
                  <div style={{height:"100%",borderRadius:4,width:barPct+"%",background:color}}/>
                </div>
              </div>;
            })}
          </div>
          <div style={{marginTop:16,paddingTop:16,borderTop:"1px solid #F1F5F9",display:"flex",justifyContent:"space-between",fontSize:12,color:"#94A3B8"}}>
            <span>전체 카테고리 강의 합계</span>
            <span style={{fontWeight:600,color:"#334155"}}>{totalCat.toLocaleString()}개</span>
          </div>
        </div>

        {/* Popular Top5 */}
        <div style={box({marginBottom:24})}>
          <h2 style={{fontSize:15,fontWeight:700,color:"#0F172A",marginBottom:4}}>⭐ 카테고리별 인기 강좌 Top 5</h2>
          <p style={{fontSize:12,color:"#94A3B8",marginBottom:16}}>수강생 수 기준 상위 5개 강좌</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:20}}>
            {cats.map((cat,i)=>(
              <button key={cat.id} onClick={()=>setPopTab(cat.name)}
                style={{padding:"6px 12px",borderRadius:999,fontSize:12,fontWeight:500,border:"none",cursor:"pointer",background:popTab===cat.name?COLORS[i%COLORS.length]:"#F1F5F9",color:popTab===cat.name?"#fff":"#64748B"}}>
                {cat.name}
              </button>
            ))}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {popCourses.map((c,idx)=>(
              <a key={idx} href={c.link} target="_blank" rel="noopener noreferrer"
                style={{display:"flex",alignItems:"center",gap:12,padding:12,borderRadius:12,background:"#F9FAFB"}}
                onMouseEnter={e=>e.currentTarget.style.background="#EFF6FF"}
                onMouseLeave={e=>e.currentTarget.style.background="#F9FAFB"}>
                <span style={{width:24,height:24,borderRadius:"50%",background:"#DBEAFE",color:"#2563EB",fontSize:11,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{idx+1}</span>
                <div style={{flex:1,minWidth:0}}>
                  <p style={{fontSize:13,fontWeight:500,color:"#1F2937",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.title}</p>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginTop:2,flexWrap:"wrap"}}>
                    <span style={{fontSize:11,padding:"2px 6px",borderRadius:4,background:"#E5E7EB",color:"#6B7280"}}>{String(c.level||"").replace(/[\[\]]/g,"")}</span>
                    <StarRating rating={Number(c.rating)||0}/>
                    <span style={{fontSize:11,color:"#94A3B8"}}>수강생 {Number(c.students||0).toLocaleString()}명</span>
                  </div>
                </div>
                <div style={{textAlign:"right",flexShrink:0}}>
                  <p style={{fontSize:13,fontWeight:700,color:"#2563EB"}}>{!c.price||c.price===""?"무료":Number(c.price).toLocaleString()+"원"}</p>
                  <p style={{fontSize:11,color:"#94A3B8"}}>바로가기 →</p>
                </div>
              </a>
            ))}
          </div>
        </div>

        {/* All Courses Drag Table */}
        <div style={box({marginBottom:32})}>
          <h2 style={{fontSize:15,fontWeight:700,color:"#0F172A",marginBottom:4}}>🗂️ 카테고리별 전체 강좌 (수강생 Top 20)</h2>
          <p style={{fontSize:12,color:"#94A3B8",marginBottom:16}}>행을 드래그해서 순서를 변경할 수 있어요 · 강의명 클릭 시 강의 페이지로 이동</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:20}}>
            {cats.map((cat,i)=>(
              <button key={cat.id} onClick={()=>setCatTab(cat.name)}
                style={{padding:"6px 14px",borderRadius:999,fontSize:12,fontWeight:500,border:"none",cursor:"pointer",transition:"all 0.15s",background:catTab===cat.name?COLORS[i%COLORS.length]:"#F1F5F9",color:catTab===cat.name?"#fff":"#64748B"}}>
                {cat.name}
              </button>
            ))}
          </div>
          {allCourses.length > 0
            ? <CourseTable key={catTab} catName={catTab} courses={allCourses}/>
            : <p style={{textAlign:"center",padding:"40px 0",fontSize:13,color:"#CBD5E1"}}>데이터가 없어요</p>}
        </div>

        <p style={{textAlign:"center",fontSize:11,color:"#CBD5E1",paddingBottom:32}}>인프런 실데이터 기반 영업용 대시보드</p>
      </div>
    </div>;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
